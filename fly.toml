# App web (Django + React). Segredos (NÃO ficam aqui, vão por `fly secrets`):
#   DJANGO_SECRET_KEY, DATABASE_URL, OPENROUTER_APIKEY, CODIGO_CONVITE
app = "ergo-assist-ai"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[deploy]
  release_command = "sh -c 'python manage.py migrate --noinput && python manage.py importar_catalogo && python manage.py indexar_conhecimento'"

  # A máquina temporária do release vem com 256 MB por padrão; o modelo de
  # embeddings precisa de mais (exit 137 = OOM no 1º deploy).
  [deploy.release_command_vm]
    size = "shared-cpu-1x"
    memory = "1gb"

[env]
  DJANGO_ALLOWED_HOSTS = "ergo-assist-ai.fly.dev"
  CSRF_TRUSTED_ORIGINS = "https://ergo-assist-ai.fly.dev"
  DJANGO_EXIGIR_SECRET = "1"
  OPENROUTER_MODELS = "deepseek/deepseek-v4.1-flash,anthropic/claude-haiku-5.5"
  # Tetos de gasto com LLM (US$/dia): por usuário e somando todos.
  LIMITE_GASTO_DIARIO_USD = "0.10"
  LIMITE_GASTO_GLOBAL_DIARIO_USD = "0.50"
  ASSISTENTE_RATE = "20/hour"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "40s"
    interval = "30s"
    method = "GET"
    path = "/api/saude"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
