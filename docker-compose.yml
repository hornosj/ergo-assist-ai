services:
  db:
    image: pgvector/pgvector:pg17
    container_name: ergo-db
    environment:
      POSTGRES_USER: ergo
      POSTGRES_PASSWORD: ergo
      POSTGRES_DB: ergo
    ports:
      - "5433:5432"
    volumes:
      - ergo-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ergo"]
      interval: 3s
      retries: 20

volumes:
  ergo-pgdata:
